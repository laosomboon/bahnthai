<!DOCTYPE html>
<html>
<head>
  <title>Bahn Thai Admin</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.11.0/build/css/alertify.min.css" />
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/alertifyjs@1.11.0/build/css/themes/default.min.css" />
  <link href='https://fonts.googleapis.com/css?family=RobotoDraft' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <nav class="w3-sidebar w3-bar-block w3-collapse w3-white w3-animate-left w3-card" style="z-index:3;width:320px;" id="mySidebar">
    <a href="/" class="w3-bar-item w3-border-bottom" style="background: blue;">
      <img src="/images/indexlogo.png" style="width:25%;">
      <i class="fa fa-remove w3-button w3-right w3-red  w3-hide-large w3-large" onclick="w3_close();"></i>
    </a>
    <div id="SidenavContainer">
      <h4 class="w3-bar-item">Menu Categories</h4>
    </div>
  </nav>

  <div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" title="Close Sidemenu" id="myOverlay"></div>

  <div class="w3-main" style="margin-left:320px;">
    <button id="logoutBtn" style="float:right;margin:20px" class="w3-btn w3-small w3-red" onclick="signMeOut()">Logout</button>
    <i class="fa fa-bars w3-button w3-white w3-hide-large w3-xlarge w3-margin-left w3-margin-top" onclick="w3_open()"></i>

    <div id="formWrapper" class="w3-container person">
      <div class="container w3-padding w3-large w3-pale-blue">
        <img class="w3-round" id="showImage" src="" alt="" width="70">
        <h2 id="showName" style="display:inline-block; margin-left:10px;"></h2>
      </div>

      <button class="w3-btn w3-green w3-margin-top" onclick="toggleNewMenuForm()">+ New Menu Item</button>

      <form id="createForm" class="form-style-9 w3-margin-top" style="display: none;" onsubmit="return false;">
        <ul>
          <li><input type="text" id="newMenuName" placeholder="Name" class="field-style field-full" /></li>
          <li>
            <select id="newMenuCategory" class="field-style field-full">
              <option value="">-- Select Category --</option>
            </select>
          </li>
          <li><textarea id="newMenuDescription" placeholder="Description" class="field-style" rows="3"></textarea></li>
          <li><input type="number" id="newMenuPrice" step="0.01" placeholder="Price (if no options/choices)" class="field-style field-full" /></li>
          <li><input type="number" id="newMenuOrder" placeholder="Display Order" class="field-style field-full" /></li>
          <li>
            <label><strong>Options (Thai name and price)</strong></label>
            <div id="newOptionsContainer"></div>
            <button type="button" onclick="addNewOption()">+ Add Option</button>
          </li>
          <li>
            <label><strong>Choices (label and price)</strong></label>
            <div id="newChoicesContainer"></div>
            <button type="button" onclick="addNewChoice()">+ Add Choice</button>
          </li>
          <li>
            <button class="w3-btn w3-small w3-green" onclick="createItem()">Create</button>
            <button class="w3-btn w3-small w3-gray" type="button" onclick="toggleNewMenuForm()">Cancel</button>
          </li>
        </ul>
      </form>

      <form class="form-style-9" onsubmit="return false;" id="updateForm">
        <ul>
          <li><input type="hidden" id="menuId" /></li>
          <li><label>Name</label><input type="text" id="menuName" class="field-style field-full" /></li>
          <li><label>Description</label><textarea id="menuDescription" class="field-style" rows="3"></textarea></li>
          <li>
                <label>Category</label>
                <select id="menuCategory" class="field-style field-full">
                  <option value="">-- Select Category --</option>
                </select>
          </li>
          <li><label>Order</label><input type="number" id="menuOrder" class="field-style field-full" /></li>
          <li id="optionsWrapper" style="display:none;"><label>Options</label><div id="optionsContainer"></div><button type="button" onclick="addOption()">+ Add Option</button></li>
          <li id="choicesWrapper" style="display:none;"><label>Choices</label><div id="choicesContainer"></div><button type="button" onclick="addChoice()">+ Add Choice</button></li>
          <li id="singlePriceWrapper" style="display:none;"><input type="number" id="menuPrice" step=".01" class="field-style field-full" placeholder="Price" /></li>
          <li>
            <button class="w3-btn w3-small w3-teal" onclick="updateItem(this);" type="button">Update</button>
            <button class="w3-btn w3-small w3-red" onclick="deleteItem(this);" type="button">Delete</button>
          </li>
        </ul>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.9.3/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.9.3/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.9.3/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.9.3/firebase-storage-compat.js"></script>
  <script src="//cdn.jsdelivr.net/npm/alertifyjs@1.11.0/build/alertify.min.js"></script>

  <script type="module" src="js/firebaseConfig.js"></script>
  <script type="module" src="js/utils.js"></script>
  <script type="module" src="js/admin.js"></script>
</body>
</html>
